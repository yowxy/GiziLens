name: gizi_lens
description: "GiziLens - Standardisasi audit mutu gizi baki makan ompreng program MBG berbasis AI."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^8.2.1
  go_router: ^17.5.0
  flutter_svg: ^2.3.0
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  camera: ^0.12.2
  onnxruntime: ^1.4.1
  image: ^4.12.0
  http: ^1.4.0
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/food/
    - assets/fonts/
    - assets/ml/best.onnx
    - assets/ml/classes.json
    - assets/ml/labels.txt
    - .env

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
